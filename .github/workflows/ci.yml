name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

      - name: Verify dist/ matches src/
        run: |
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi

      - name: Check every published artifact loads
        run: |
          node -e "const s=require('./dist/FileSaver.js'); if(typeof s!=='function') throw new Error('cjs broken')"
          node -e "import('./dist/FileSaver.mjs').then(m=>{if(typeof m.default!=='function') throw new Error('esm broken')})"